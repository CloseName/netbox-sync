name: Test updater contracts
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'tests/test_update_test.py'
      - 'tests/test_deployment_foundation.py'
      - 'tests/test_backup_restore.py'
      - '.github/workflows/test-updater.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_update_test.py tests/test_deployment_foundation.py tests/test_backup_restore.py -q
