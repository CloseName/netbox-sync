name: ESXi reconciliation
on:
  pull_request:
    paths:
      - 'netbox_sync/**'
      - 'tests/test_esxi*.py'
      - 'tests/test_recreated_vm.py'
      - '.github/workflows/esxi-reconciliation.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m black --check netbox_sync
      # Deployment, TLS and worker socket tests exercise the production root-owned layout.
      - run: sudo "$(command -v python)" -m pytest -q
