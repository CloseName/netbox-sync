name: Selectel collection boundaries
on:
  pull_request:
    branches: [main]
    paths: ['tools/selectel_audit/**', 'tests/test_selectel_collection_boundaries.py', '.github/workflows/selectel-collection.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tools/selectel_audit tests/test_selectel_collection_boundaries.py -q
