name: Selectel runner and UI
on:
  pull_request:
    branches: [main]
    paths: ['netbox_sync/selectel*.py', 'netbox_sync/api/selectel.py', 'netbox_sync/api/auth.py', 'deploy/*update_test.py', 'tests/test_*update_test.py', 'tests/test_selectel*.py', 'frontend/src/pages/Selectel*.tsx', 'frontend/e2e/selectel.spec.ts', '.github/workflows/selectel-runner.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pytest tests -q -k 'selectel or update_test'
      - run: python -m black --check netbox_sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test e2e/selectel.spec.ts
        working-directory: frontend
