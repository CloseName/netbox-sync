name: Selectel Guard integration
on:
  push:
    branches: [feat/selectel-guard-bindings]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-netbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest tests.test_provider_policy tests.test_selectel_inventory tests.test_selectel_ipam_policy tests.test_provider_network_status tests.test_resource_registry_policy tests.test_resource_tree
          python -m unittest discover -s tools/selectel_audit -t . -p 'test_*.py'
          bash -n deploy/update-hardware-identity-test.sh deploy/update-provider-ui-test.sh deploy/reconcile-selectel-test.sh deploy/update-host-topology-test.sh deploy/update-selectel-test.sh deploy/collect-selectel-test.sh deploy/project-selectel-ipam-test.sh deploy/probe-selectel-ports-test.sh deploy/update-provider-network-panel-test.sh deploy/audit-selectel-account-test.sh deploy/import-resource-registry-test.sh
      - name: Smoke test read-only port probe container
        run: |
          docker build -f tools/selectel_audit/Dockerfile -t selectel-port-probe:test .
          docker run --rm --read-only --network none --cap-drop ALL --entrypoint python selectel-port-probe:test -m selectel_audit.port_probe --help
      - name: Test host topology and collector compatibility
        run: |
          python -m pip install -e '.[web]' pytest httpx
          python -m pytest -q tests/test_recreated_vm.py tests/test_reconciliation_wait.py
          bash -n deploy/update-selectel-payload-production.sh deploy/update-recreated-vm-test.sh deploy/update-vm-replacement-test.sh deploy/update-production-sync.sh deploy/update-production-netbox.sh
          sudo "$(which python)" -m pytest -q tests/test_hardware_identity.py tests/test_hardware_identity_plan.py tests/test_sync_plan.py tests/test_host_network_paths.py tests/test_proxmox_discovery.py tests/test_esxi_host_network.py tests/test_prerequisite_preparation.py tests/test_network_evidence.py tests/test_discovery_review.py tests/test_first_sync.py
      - name: Test Selectel account API
        # Includes the web account API, credential projection and scope checks.
        run: sudo "$(which python)" -m pytest -q tests/test_selectel_mvp.py tests/test_selectel_payload.py tests/test_pfsense_connect.py tests/test_pfsense_snapshot.py tests/test_pfsense_inventory.py tests/test_pfsense_preview.py tests/test_pfsense_scheduler.py
      - name: Prepare disposable PostgreSQL service
        run: |
          docker run -d --name provider-test-pg --network none \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16
          for attempt in $(seq 1 60); do
            if docker exec provider-test-pg pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Prepare disposable Redis
        run: |
          docker run -d --name provider-test-redis --network container:provider-test-pg redis:7-alpine
          for attempt in $(seq 1 30); do
            if docker exec provider-test-redis redis-cli ping; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test actual NetBox and SQL triggers
        run: |
          docker build -f deploy/Dockerfile.netbox-guard -t provider-guard:test .
          docker run --rm --network container:provider-test-pg \
            --mount type=bind,src="$PWD",dst=/app,readonly \
            --mount type=bind,src="$PWD/tests/netbox_guard_plugins.py",dst=/etc/netbox/config/plugins.py,readonly \
            -e NETBOX_SYNC_ISOLATED_MODEL_TEST=1 \
            -e NETBOX_SYNC_MODEL_DB=netbox_sync_guard_test \
            --entrypoint /opt/netbox/venv/bin/python provider-guard:test \
            /app/tests/netbox_provider_binding_scenario.py
      - name: Remove disposable database container
        if: always()
        run: docker rm -f -v provider-test-redis provider-test-pg

  reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: netbox_sync_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NETBOX_SYNC_TEST_POSTGRES_DSN: postgresql://postgres:disposable-test-only@localhost:5432/netbox_sync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[web]' pytest httpx sqlalchemy alembic
      - run: sudo --preserve-env=NETBOX_SYNC_TEST_POSTGRES_DSN "$(which python)" -m pytest -q tests/test_reconciliation_wait.py tests/test_run_reconciliation.py tests/test_shared_apply_lock.py tests/test_scheduler.py tests/test_deployment_foundation.py
      - run: bash -n scripts/run-scheduled-sync.sh deploy/update-reconciliation-production.sh
