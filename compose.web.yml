# Opt-in extension of the same Compose project. Also runnable by itself for development.
services:
  netbox-sync-api:
    profiles: [web]
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${NETBOX_SYNC_WEB_PORT:-8000}:8000"
    environment:
      NETBOX_SYNC_REGISTRY_DSN: ${NETBOX_SYNC_REGISTRY_DSN:-}
      NETBOX_SYNC_REGISTRY_SCHEMA: ${NETBOX_SYNC_REGISTRY_SCHEMA:-}
      NB_API_URL: ${NB_API_URL:-}
      # Presence only. Do not mount/read NetBox or source secrets in the API.
      NB_API_TOKEN_FILE: ${NB_API_TOKEN_FILE:-}
      NETBOX_SYNC_REGISTRATION_DSN: ${NETBOX_SYNC_REGISTRATION_DSN:-}
      NETBOX_SYNC_BROKER_SOCKET: /run/netbox-sync-broker/broker.sock
      NETBOX_SYNC_BOOTSTRAP_SOCKET: /run/netbox-sync-bootstrap/worker.sock
      NETBOX_SYNC_LIFECYCLE_SOCKET: /run/netbox-sync-lifecycle/worker.sock
      NETBOX_SYNC_DISCOVERY_SOCKET: /run/netbox-sync-discovery/worker.sock
      NETBOX_SYNC_APPLY_SOCKET: /run/netbox-sync-apply/worker.sock
      NETBOX_SYNC_SCHEDULE_SOCKET: /run/netbox-sync-schedule/worker.sock
      NETBOX_SYNC_DIAGNOSTICS_STALE_SECONDS: ${NETBOX_SYNC_DIAGNOSTICS_STALE_SECONDS:-7200}
      NETBOX_SYNC_WRITE_HOSTS: ${NETBOX_SYNC_WRITE_HOSTS:-127.0.0.1:8000,localhost:8000}
      NETBOX_SYNC_ONBOARDING_ALLOWED_CIDRS: ${NETBOX_SYNC_ONBOARDING_ALLOWED_CIDRS:-}
      NETBOX_SYNC_ONBOARDING_DENIED_CIDRS: ${NETBOX_SYNC_ONBOARDING_DENIED_CIDRS:-}
      NETBOX_SYNC_ONBOARDING_ALLOWED_HOSTS: ${NETBOX_SYNC_ONBOARDING_ALLOWED_HOSTS:-}
      NETBOX_SYNC_ONBOARDING_ALLOWED_SUFFIXES: ${NETBOX_SYNC_ONBOARDING_ALLOWED_SUFFIXES:-}
    volumes:
      - netbox-sync-broker-socket:/run/netbox-sync-broker:ro
      - netbox-sync-bootstrap-socket:/run/netbox-sync-bootstrap:ro
      - netbox-sync-lifecycle-socket:/run/netbox-sync-lifecycle:ro
      - netbox-sync-discovery-socket:/run/netbox-sync-discovery:ro
      - netbox-sync-apply-socket:/run/netbox-sync-apply:ro
      - netbox-sync-schedule-socket:/run/netbox-sync-schedule:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  netbox-sync-secret-broker:
    profiles: [onboarding]
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "0:0"
    group_add: ["10001"]
    command: [python, -m, netbox_sync.secret_broker, --socket, /run/netbox-sync-broker/broker.sock,
              --secret-root, /var/lib/netbox-sync/source-secrets, --allowed-uid, "10001"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - netbox-sync-broker-socket:/run/netbox-sync-broker
      - ${NETBOX_SYNC_SOURCE_SECRET_DIR:-../secrets/sources}:/var/lib/netbox-sync/source-secrets
    restart: unless-stopped

  netbox-sync-lifecycle-worker:
    profiles: [onboarding]
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "0:0"
    command: [python, -m, netbox_sync.lifecycle_worker]
    environment:
      NETBOX_SYNC_LIFECYCLE_WRITER_DSN: ${NETBOX_SYNC_LIFECYCLE_WRITER_DSN:-}
      NETBOX_SYNC_REGISTRY_SCHEMA: ${NETBOX_SYNC_REGISTRY_SCHEMA:-}
    networks: [netbox]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    volumes:
      - netbox-sync-lifecycle-socket:/run/netbox-sync-lifecycle
      - netbox-sync-broker-socket:/run/netbox-sync-broker:ro
      - ${NETBOX_SYNC_APPLY_LOCK_DIR:-/run/netbox-sync}:/run/netbox-sync-lock
    restart: unless-stopped

  netbox-sync-bootstrap-worker:
    profiles: [onboarding]
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "0:0"
    command: [python, -m, netbox_sync.bootstrap_worker]
    networks: [netbox]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${NETBOX_SYNC_CA_DIR:-../secrets/ca}:/run/netbox-sync-ca:ro
      - netbox-sync-bootstrap-socket:/run/netbox-sync-bootstrap
      - ${NETBOX_SYNC_APPLY_LOCK_DIR:-/run/netbox-sync}:/run/netbox-sync-lock
      - ${NETBOX_SYNC_NETBOX_SECRET_DIR:-../secrets/netbox}:/var/lib/netbox-sync/netbox
    restart: unless-stopped

  netbox-sync-discovery-worker:
    profiles: [discovery]
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "0:0"
    command: [python, -m, netbox_sync.discovery_worker,
              --socket, /run/netbox-sync-discovery/worker.sock,
              --secret-root, /run/secrets/netbox-sync,
              --source-secret-root, /run/secrets/netbox-sync-sources,
              --netbox-token-file, /run/secrets/netbox-read-token,
              --api-uid, "10001", --child-uid, "10001", --child-gid, "10001"]
    environment:
      NETBOX_SYNC_DISCOVERY_REGISTRY_DSN: ${NETBOX_SYNC_DISCOVERY_REGISTRY_DSN:-}
      NETBOX_SYNC_OPERATION_WRITER_DSN: ${NETBOX_SYNC_OPERATION_WRITER_DSN:-}
      NETBOX_SYNC_REGISTRY_SCHEMA: ${NETBOX_SYNC_REGISTRY_SCHEMA:-}
      NETBOX_SYNC_NETBOX_CONFIG_FILE: /run/secrets/netbox/bootstrap.json
      NETBOX_SYNC_DISCOVERY_NB_API_URL: ${NETBOX_SYNC_DISCOVERY_NB_API_URL:-}
    volumes:
      - ${NETBOX_SYNC_CA_DIR:-../secrets/ca}:/run/netbox-sync-ca:ro
      - netbox-sync-discovery-socket:/run/netbox-sync-discovery
      - ${NETBOX_SYNC_LEGACY_SOURCE_SECRET_DIR:-../secrets/legacy-sources}:/run/secrets/netbox-sync:ro
      - ${NETBOX_SYNC_SOURCE_SECRET_DIR:-../secrets/sources}:/run/secrets/netbox-sync-sources:ro
      - ${NETBOX_SYNC_NETBOX_SECRET_DIR:-../secrets/netbox}:/run/secrets/netbox:ro
    networks: [netbox]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  netbox-sync-apply-worker:
    profiles: [apply]
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "0:0"
    command: [python, -m, netbox_sync.apply_worker,
              --socket, /run/netbox-sync-apply/worker.sock,
              --secret-root, /run/secrets/netbox-sync,
              --source-secret-root, /run/secrets/netbox-sync-sources,
              --netbox-token-file, /run/secrets/netbox-apply-token,
              --lock-path, /run/netbox-sync-lock/apply.lock,
              --api-uid, "10001", --child-uid, "10001", --child-gid, "10001"]
    environment:
      NETBOX_SYNC_APPLY_REGISTRY_DSN: ${NETBOX_SYNC_APPLY_REGISTRY_DSN:-}
      NETBOX_SYNC_RUN_WRITER_DSN: ${NETBOX_SYNC_RUN_WRITER_DSN:-}
      NETBOX_SYNC_REGISTRY_SCHEMA: ${NETBOX_SYNC_REGISTRY_SCHEMA:-}
      NETBOX_SYNC_NETBOX_CONFIG_FILE: /run/secrets/netbox/bootstrap.json
      NETBOX_SYNC_APPLY_NB_API_URL: ${NETBOX_SYNC_APPLY_NB_API_URL:-}
    volumes:
      - ${NETBOX_SYNC_CA_DIR:-../secrets/ca}:/run/netbox-sync-ca:ro
      - netbox-sync-apply-socket:/run/netbox-sync-apply
      - ${NETBOX_SYNC_APPLY_LOCK_DIR:-/run/netbox-sync}:/run/netbox-sync-lock
      - ${NETBOX_SYNC_LEGACY_SOURCE_SECRET_DIR:-../secrets/legacy-sources}:/run/secrets/netbox-sync:ro
      - ${NETBOX_SYNC_SOURCE_SECRET_DIR:-../secrets/sources}:/run/secrets/netbox-sync-sources:ro
      - ${NETBOX_SYNC_NETBOX_SECRET_DIR:-../secrets/netbox}:/run/secrets/netbox:ro
    networks: [netbox]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  netbox-sync-schedule-worker:
    profiles: [schedule]
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "0:0"
    command: [python, -m, netbox_sync.schedule_worker,
              --socket, /run/netbox-sync-schedule/worker.sock, --api-uid, "10001"]
    environment:
      NETBOX_SYNC_SCHEDULE_WRITER_DSN: ${NETBOX_SYNC_SCHEDULE_WRITER_DSN:-}
      NETBOX_SYNC_REGISTRY_SCHEMA: ${NETBOX_SYNC_REGISTRY_SCHEMA:-}
    volumes:
      - netbox-sync-schedule-socket:/run/netbox-sync-schedule
    networks: [netbox]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  netbox-sync-bootstrap-socket:
  netbox-sync-lifecycle-socket:
  netbox-sync-broker-socket:
  netbox-sync-discovery-socket:
  netbox-sync-apply-socket:
  netbox-sync-schedule-socket:

networks:
  netbox:
    external: true
    name: netbox_default
