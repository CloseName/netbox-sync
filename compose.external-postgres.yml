# Optional override. Runtime DSNs must point at the operator-managed database.
services:
  netbox-sync-auth-worker:
    networks: !override [netbox-sync-egress]
  postgres:
    profiles: [bundled-postgres]
  netbox-sync-api:
    networks: [netbox-sync-egress]
  netbox-sync-lifecycle-worker:
    networks: [netbox-sync-egress]
  netbox-sync-schedule-worker:
    networks: [netbox-sync-egress]
  netbox-sync-db-roles:
    networks: [netbox-sync-egress]
  netbox-sync-migrate:
    networks: [netbox-sync-egress]
  netbox-sync-db-grants:
    networks: [netbox-sync-egress]
  netbox-sync-db-restore-roles:
    networks: [netbox-sync-egress]
