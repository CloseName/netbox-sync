name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}

x-app: &app
  image: ${NETBOX_SYNC_IMAGE:-netbox-sync:local}
  build:
    context: .
    dockerfile: Dockerfile.web
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: &bounded-logging
    driver: local
    options:
      max-size: 10m
      max-file: "5"

services:
  netbox-sync-proxy:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-proxy
    image: ${NETBOX_SYNC_PROXY_IMAGE:-nginx:stable-alpine}
    user: "10001:10001"
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        envsubst '$$NETBOX_SYNC_PUBLIC_HOST' < /etc/netbox-sync/nginx.conf.template > /tmp/nginx.conf;
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    environment:
      NETBOX_SYNC_PUBLIC_HOST: ${NETBOX_SYNC_PUBLIC_HOST:-}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ${NETBOX_SYNC_TLS_TEMPLATE:-./deploy/nginx.conf.template}:/etc/netbox-sync/nginx.conf.template:ro
      - ${NETBOX_SYNC_TLS_DIR:-./deploy/example-secrets/tls}:/run/netbox-sync-tls:ro
      - netbox-sync-http-socket:/run/netbox-sync-http:ro
    networks: [netbox-sync-web]
    read_only: true
    tmpfs:
      - "/tmp:size=64m,mode=1777"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *bounded-logging
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8081/health]
      interval: 30s
      timeout: 3s
      retries: 3

  netbox-sync-http-init:
    <<: *app
    profiles: [tools]
    user: "0:0"
    command: [python, -m, netbox_sync.web_runtime, init]
    network_mode: none
    cap_add: [CHOWN]
    volumes:
      - netbox-sync-http-socket:/run/netbox-sync-http
    restart: "no"

  postgres:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-postgres
    image: ${NETBOX_SYNC_POSTGRES_IMAGE:-postgres:16-bookworm}
    environment:
      POSTGRES_DB: netbox_sync
      POSTGRES_USER: netbox_sync_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
    secrets: [postgres_bootstrap_password]
    volumes:
      - netbox-sync-postgres:/var/lib/postgresql/data
    networks: [netbox-sync-db]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U netbox_sync_bootstrap -d netbox_sync"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: *bounded-logging

  netbox-sync-api:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-api
    <<: *app
    user: "10001:10001"
    command: [python, -m, netbox_sync.web_runtime, serve]
    env_file: ${NETBOX_SYNC_CONFIG_DIR:-./deploy/examples}/api.env
    environment:
      NETBOX_SYNC_PROBE_SOCKET: /run/netbox-sync-probe/worker.sock
    volumes:
      - netbox-sync-probe-socket:/run/netbox-sync-probe:ro
      - netbox-sync-http-socket:/run/netbox-sync-http
      - netbox-sync-broker-socket:/run/netbox-sync-broker:ro
      - netbox-sync-lifecycle-socket:/run/netbox-sync-lifecycle:ro
      - netbox-sync-bootstrap-socket:/run/netbox-sync-bootstrap:ro
      - netbox-sync-discovery-socket:/run/netbox-sync-discovery:ro
      - netbox-sync-apply-socket:/run/netbox-sync-apply:ro
      - netbox-sync-schedule-socket:/run/netbox-sync-schedule:ro
    networks: [netbox-sync-db]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, netbox_sync.web_runtime, health]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # The API stays DB-only. This isolated service can only perform ephemeral probes.
  netbox-sync-probe-worker:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-probe-worker
    <<: *app
    user: "0:0"
    command: [python, -m, netbox_sync.probe_worker]
    networks: [netbox-sync-probe-egress]
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    volumes:
      - netbox-sync-probe-socket:/run/netbox-sync-probe
    restart: unless-stopped

  netbox-sync-secret-broker:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-secret-broker
    <<: *app
    user: "0:0"
    group_add: ["10001"]
    command: [python, -m, netbox_sync.secret_broker, --socket, /run/netbox-sync-broker/broker.sock, --secret-root, /var/lib/netbox-sync/source-secrets, --allowed-uid, "10001"]
    network_mode: none
    cap_add: [CHOWN]
    volumes:
      - netbox-sync-broker-socket:/run/netbox-sync-broker
      - ${NETBOX_SYNC_SOURCE_SECRET_DIR:-./deploy/example-secrets/sources}:/var/lib/netbox-sync/source-secrets
    restart: unless-stopped

  netbox-sync-lifecycle-worker:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-lifecycle-worker
    <<: *app
    user: "0:0"
    command: [python, -m, netbox_sync.lifecycle_worker]
    env_file: ${NETBOX_SYNC_CONFIG_DIR:-./deploy/examples}/broker.env
    networks: [netbox-sync-db]
    cap_add: [CHOWN]
    volumes:
      - netbox-sync-lifecycle-socket:/run/netbox-sync-lifecycle
      - netbox-sync-broker-socket:/run/netbox-sync-broker:ro
      - ${NETBOX_SYNC_APPLY_LOCK_DIR:-/run/netbox-sync}:/run/netbox-sync-lock
    restart: unless-stopped

  netbox-sync-bootstrap-worker:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-bootstrap-worker
    <<: *app
    user: "0:0"
    command: [python, -m, netbox_sync.bootstrap_worker]
    networks: [netbox-sync-egress]
    cap_add: [SETUID, SETGID, CHOWN]
    volumes:
      - ${NETBOX_SYNC_CA_DIR:-./deploy/example-secrets/ca}:/run/netbox-sync-ca:ro
      - netbox-sync-bootstrap-socket:/run/netbox-sync-bootstrap
      - ${NETBOX_SYNC_APPLY_LOCK_DIR:-/run/netbox-sync}:/run/netbox-sync-lock
      - ${NETBOX_SYNC_NETBOX_SECRET_DIR:-./deploy/example-secrets/netbox}:/var/lib/netbox-sync/netbox
    restart: unless-stopped

  netbox-sync-discovery-worker:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-discovery-worker
    <<: *app
    user: "0:0"
    command: [python, -m, netbox_sync.discovery_worker, --socket, /run/netbox-sync-discovery/worker.sock, --secret-root, /run/secrets/netbox-sync, --source-secret-root, /run/secrets/netbox-sync-sources, --netbox-token-file, /run/secrets/netbox/read-token, --api-uid, "10001", --child-uid, "10001", --child-gid, "10001"]
    env_file: ${NETBOX_SYNC_CONFIG_DIR:-./deploy/examples}/discovery.env
    volumes:
      - ${NETBOX_SYNC_CA_DIR:-./deploy/example-secrets/ca}:/run/netbox-sync-ca:ro
      - netbox-sync-discovery-socket:/run/netbox-sync-discovery
      - ${NETBOX_SYNC_SOURCE_SECRET_DIR:-./deploy/example-secrets/sources}:/run/secrets/netbox-sync-sources:ro
      - ${NETBOX_SYNC_NETBOX_SECRET_DIR:-./deploy/example-secrets/netbox}:/run/secrets/netbox:ro
    networks: [netbox-sync-db, netbox-sync-egress]
    cap_add: [SETUID, SETGID, CHOWN]
    restart: unless-stopped

  netbox-sync-apply-worker:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-apply-worker
    <<: *app
    user: "0:0"
    command: [python, -m, netbox_sync.apply_worker, --socket, /run/netbox-sync-apply/worker.sock, --secret-root, /run/secrets/netbox-sync, --source-secret-root, /run/secrets/netbox-sync-sources, --netbox-token-file, /run/secrets/netbox/apply-token, --lock-path, /run/netbox-sync-lock/apply.lock, --api-uid, "10001", --child-uid, "10001", --child-gid, "10001"]
    env_file: ${NETBOX_SYNC_CONFIG_DIR:-./deploy/examples}/apply.env
    volumes:
      - ${NETBOX_SYNC_CA_DIR:-./deploy/example-secrets/ca}:/run/netbox-sync-ca:ro
      - netbox-sync-apply-socket:/run/netbox-sync-apply
      - ${NETBOX_SYNC_APPLY_LOCK_DIR:-/run/netbox-sync}:/run/netbox-sync-lock
      - ${NETBOX_SYNC_SOURCE_SECRET_DIR:-./deploy/example-secrets/sources}:/run/secrets/netbox-sync-sources:ro
      - ${NETBOX_SYNC_NETBOX_SECRET_DIR:-./deploy/example-secrets/netbox}:/run/secrets/netbox:ro
    networks: [netbox-sync-db, netbox-sync-egress]
    cap_add: [SETUID, SETGID, CHOWN]
    restart: unless-stopped

  netbox-sync-schedule-worker:
    container_name: ${NETBOX_SYNC_COMPOSE_PROJECT:-netbox-sync}-schedule-worker
    <<: *app
    user: "0:0"
    command: [python, -m, netbox_sync.schedule_worker, --socket, /run/netbox-sync-schedule/worker.sock, --api-uid, "10001"]
    env_file: ${NETBOX_SYNC_CONFIG_DIR:-./deploy/examples}/schedule.env
    volumes:
      - netbox-sync-schedule-socket:/run/netbox-sync-schedule
    networks: [netbox-sync-db]
    cap_add: [CHOWN]
    restart: unless-stopped

  netbox-sync-scheduler:
    <<: *app
    profiles: [scheduled]
    user: "0:0"
    command: [netbox-sync]
    env_file: ${NETBOX_SYNC_CONFIG_DIR:-./deploy/examples}/scheduler.env
    volumes:
      - ${NETBOX_SYNC_CA_DIR:-./deploy/example-secrets/ca}:/run/netbox-sync-ca:ro
      - ${NETBOX_SYNC_SOURCE_SECRET_DIR:-./deploy/example-secrets/sources}:/run/secrets/netbox-sync-sources:ro
      - ${NETBOX_SYNC_NETBOX_SECRET_DIR:-./deploy/example-secrets/netbox}:/run/secrets/netbox:ro
    networks: [netbox-sync-db, netbox-sync-egress]
    restart: "no"

  netbox-sync-db-roles:
    <<: *app
    profiles: [tools]
    user: "0:0"
    command: [python, -m, netbox_sync.deployment, bootstrap-roles]
    environment:
      NETBOX_SYNC_DB_HOST: ${NETBOX_SYNC_DB_HOST:-postgres}
      NETBOX_SYNC_DB_PORT: ${NETBOX_SYNC_DB_PORT:-5432}
      NETBOX_SYNC_DB_NAME: ${NETBOX_SYNC_DB_NAME:-netbox_sync}
      NETBOX_SYNC_DB_PASSWORD_DIR: /run/secrets/netbox-sync-db
    volumes:
      - ${NETBOX_SYNC_INFRA_SECRET_DIR:-./deploy/example-secrets/infrastructure}:/run/secrets/netbox-sync-db:ro
    networks: [netbox-sync-db]
    restart: "no"

  netbox-sync-migrate:
    <<: *app
    profiles: [tools]
    user: "0:0"
    command: [python, -m, netbox_sync.deployment, migrate]
    environment:
      NETBOX_SYNC_DB_HOST: ${NETBOX_SYNC_DB_HOST:-postgres}
      NETBOX_SYNC_DB_PORT: ${NETBOX_SYNC_DB_PORT:-5432}
      NETBOX_SYNC_DB_NAME: ${NETBOX_SYNC_DB_NAME:-netbox_sync}
      NETBOX_SYNC_DB_PASSWORD_DIR: /run/secrets/netbox-sync-db
      NETBOX_SYNC_REGISTRY_SCHEMA: netbox_sync
    volumes:
      - ${NETBOX_SYNC_INFRA_SECRET_DIR:-./deploy/example-secrets/infrastructure}:/run/secrets/netbox-sync-db:ro
    networks: [netbox-sync-db]
    restart: "no"

  netbox-sync-db-grants:
    <<: *app
    profiles: [tools]
    user: "0:0"
    command: [python, -m, netbox_sync.deployment, apply-grants]
    environment:
      NETBOX_SYNC_DB_HOST: ${NETBOX_SYNC_DB_HOST:-postgres}
      NETBOX_SYNC_DB_PORT: ${NETBOX_SYNC_DB_PORT:-5432}
      NETBOX_SYNC_DB_NAME: ${NETBOX_SYNC_DB_NAME:-netbox_sync}
      NETBOX_SYNC_DB_PASSWORD_DIR: /run/secrets/netbox-sync-db
      NETBOX_SYNC_REGISTRY_SCHEMA: netbox_sync
    volumes:
      - ${NETBOX_SYNC_INFRA_SECRET_DIR:-./deploy/example-secrets/infrastructure}:/run/secrets/netbox-sync-db:ro
    networks: [netbox-sync-db]
    restart: "no"

  netbox-sync-db-restore-roles:
    <<: *app
    profiles: [tools]
    user: "0:0"
    command: [python, -m, netbox_sync.deployment, restore-role-passwords]
    environment:
      NETBOX_SYNC_DB_HOST: ${NETBOX_SYNC_DB_HOST:-postgres}
      NETBOX_SYNC_DB_PORT: ${NETBOX_SYNC_DB_PORT:-5432}
      NETBOX_SYNC_DB_NAME: ${NETBOX_SYNC_DB_NAME:-netbox_sync}
      NETBOX_SYNC_DB_PASSWORD_DIR: /run/secrets/netbox-sync-db
    volumes:
      - ${NETBOX_SYNC_RESTORE_PASSWORD_DIR:-./deploy/example-secrets/infrastructure}:/run/secrets/netbox-sync-db:ro
    networks: [netbox-sync-db]
    restart: "no"

volumes:
  netbox-sync-probe-socket:
  netbox-sync-http-socket:
  netbox-sync-postgres:
    name: ${NETBOX_SYNC_POSTGRES_VOLUME:-netbox-sync-postgres-data}
  netbox-sync-broker-socket:
  netbox-sync-lifecycle-socket:
  netbox-sync-bootstrap-socket:
  netbox-sync-discovery-socket:
  netbox-sync-apply-socket:
  netbox-sync-schedule-socket:

networks:
  netbox-sync-probe-egress:
  netbox-sync-db:
    internal: true
  netbox-sync-egress:
  netbox-sync-web:

secrets:
  postgres_bootstrap_password:
    file: ${NETBOX_SYNC_INFRA_SECRET_DIR:-./deploy/example-secrets/infrastructure}/postgres_bootstrap_password
