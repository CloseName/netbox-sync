[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-sync"
version = "0.2.4"
authors = [
    { name = "Aloïs Micard", email = "alois@micard.lu" },
]
description = "Safely synchronize multiple virtualization sources to NetBox"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pynetbox>=7.4",
    "proxmoxer>=2.2",
    "psycopg[binary]>=3.2,<4",
    "pyvmomi>=8.0.3.0.1,<9",
    "requests>=2.32",
    "argon2-cffi>=23.1,<26",
]

[project.urls]
Homepage = "https://github.com/CloseName/netbox-sync"
Issues = "https://github.com/CloseName/netbox-sync/issues"
Changelog = "https://github.com/CloseName/netbox-sync/blob/main/Changelog.md"

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.scripts]
netbox-sync = "netbox_sync:main"

[tool.setuptools.packages.find]
include = ["netbox_sync*"]

[license]
file = 'LICENSE.txt'
