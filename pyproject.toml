[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-sync"
version = "0.2.4"
authors = [
    { name = "Aloïs Micard", email = "alois@micard.lu" },
]
description = "Safely synchronize multiple virtualization sources to NetBox"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "tzdata>=2024.1",
    "ldap3>=2.9.1,<3",
    "pynetbox>=7.4",
    "proxmoxer>=2.2",
    "psycopg[binary]>=3.2,<4",
    "pyvmomi>=8.0.3.0.1,<9",
    "requests>=2.32",
    "paramiko>=3.5,<5",
    "argon2-cffi>=23.1,<26",
]

[project.urls]
Homepage = "https://github.com/CloseName/netbox-sync"
Issues = "https://github.com/CloseName/netbox-sync/issues"
Changelog = "https://github.com/CloseName/netbox-sync/blob/main/Changelog.md"

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.scripts]
netbox-sync = "netbox_sync:main"

[tool.setuptools.packages.find]
include = ["netbox_sync*"]

[license]
file = 'LICENSE.txt'

[tool.setuptools.package-data]
netbox_sync = ["public_errors.json"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pylint.main]
# These imports exist only inside the Linux worker or deployed NetBox runtime.
# Keep application import errors enabled; do not ignore netbox_sync or netbox_guard wholesale.
ignored-modules = [
    "fcntl", "resource",
    "django.contrib.contenttypes.models", "django.db", "django.db.models",
    "virtualization.models", "dcim.models", "ipam.models",
    "netbox_guard.pfsense_preview",
]

[tool.pylint.typecheck]
# Exact POSIX members used by the Linux deployment, absent from Windows stdlib stubs.
generated-members = [
    'os[.](geteuid|O_NOFOLLOW|O_DIRECTORY|O_NONBLOCK|chown|fork|killpg|setgroups|setgid|setuid)\b',
    'socket[.](AF_UNIX|SO_PEERCRED)\b',
    'signal[.](SIGCHLD|SIGKILL)\b',
]

[tool.pylint.reports]
# An error cannot be compensated for by a high aggregate style score.
fail-on = ["E", "F"]
