{% if linked_networks %}
<div class="card"><h2 class="card-header">Сети и IP-адреса</h2><div class="card-body">
{% for network in linked_networks %}<p><a href="{% url 'plugins:netbox_guard:networks' kind=network_kind pk=object.pk %}?network={{ network.id|urlencode }}">{{ network.vm_name }} · {{ network.name }} ({{ network.key }}) · {{ network.cidr }}</a></p>{% endfor %}
</div></div>
{% endif %}
