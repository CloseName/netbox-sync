<section class="border rounded mb-3 overflow-hidden">
  <h3 class="h5 m-0 p-3 border-bottom">{{ title }}</h3>
  <table class="table mb-0" style="table-layout:fixed;overflow-wrap:anywhere"><colgroup><col style="width:42%"><col style="width:58%"></colgroup><tbody>
    {% for label, value in rows %}<tr><th class="px-3 fw-normal">{% if label == 'Установленная память' %}Установлено по данным Selectel{% else %}{{ label }}{% endif %}</th><td class="pe-3">{{ value }}</td></tr>{% endfor %}
  </tbody></table>
</section>
