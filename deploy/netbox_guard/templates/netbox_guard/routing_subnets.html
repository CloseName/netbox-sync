<table class="table"><thead><tr><th>Имя подсети</th><th>CIDR</th><th>Шлюз</th><th>Служебные IP</th></tr></thead><tbody>{% for subnet in subnets %}<tr><td><a href="{{ subnet.href }}">{{ subnet.name }}</a>{% if subnet.retained %} · Сохранено ранее{% endif %}</td><td><a href="{{ subnet.href }}">{{ subnet.cidr }}</a></td><td>{{ subnet.gateway|default:'—' }}</td><td>{% for ip in subnet.service_addresses %}<div>{{ ip }}</div>{% empty %}—{% endfor %}</td></tr>{% empty %}<tr><td colspan="4">Подсети не найдены.</td></tr>{% endfor %}</tbody></table>
