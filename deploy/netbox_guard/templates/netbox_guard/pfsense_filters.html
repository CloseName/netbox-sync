{% load firewall_labels %}
<form method="get" class="mb-3" style="display:flex;flex-wrap:wrap;gap:.5rem">
{% for key,value in path.items %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
{% if filters.alias_type %}<input type="hidden" name="alias_type" value="{{ filters.alias_type }}">{% endif %}
{% if filters.group %}<input type="hidden" name="group" value="{{ filters.group }}">{% endif %}
<input class="form-control" style="flex:2 1 18rem;min-width:0;max-width:100%" name="q" value="{{ filters.q }}" placeholder="{% fwlabel 'Name, IP, CIDR, port or identifier' %}" aria-label="{% fwlabel 'Search firewall' %}">
<select name="scope" class="form-select" style="flex:1 1 12rem;width:auto" aria-label="{% fwlabel 'Search scope' %}"><option value="section">{% fwlabel 'Current tab' %}</option><option value="firewall" {% if filters.scope == 'firewall' %}selected{% endif %}>{% fwlabel 'Search this firewall' %}</option></select>
<select name="enabled" class="form-select" style="flex:1 1 10rem;width:auto" aria-label="{% fwlabel 'Enabled' %}"><option value="">{% fwlabel 'Any status' %}</option><option value="yes" {% if filters.enabled == 'yes' %}selected{% endif %}>{% fwlabel 'Enabled' %}</option><option value="no" {% if filters.enabled == 'no' %}selected{% endif %}>{% fwlabel 'Disabled' %}</option></select>
<button class="btn btn-primary">{% fwlabel 'Search' %}</button></form>
