<form method="get" class="mb-3" style="display:flex;flex-wrap:wrap;gap:.5rem">
{% if appliance %}<input type="hidden" name="tab" value="{{ tab }}">{% endif %}
<input class="form-control" style="flex:2 1 18rem;min-width:0;max-width:100%" name="q" value="{{ filters.q }}" placeholder="Имя, IP, CIDR, порт или идентификатор" aria-label="Поиск pfSense">
{% if not appliance %}<select name="appliance" class="form-select" style="flex:1 1 12rem;width:auto" aria-label="Firewall"><option value="">Все firewall</option>{% for item in appliances %}<option value="{{ item.pk }}" {% if filters.appliance == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.vm.name }}</option>{% endfor %}</select>
<select name="site" class="form-select" style="flex:1 1 12rem;width:auto" aria-label="Площадка"><option value="">Все площадки</option>{% for item in sites %}<option value="{{ item.pk }}" {% if filters.site == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select>
<select name="category" class="form-select" style="flex:1 1 10rem;width:auto" aria-label="Тип объекта"><option value="">Все типы</option>{% for key,label in categories %}<option value="{{ key }}" {% if filters.category == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% endif %}
<select name="state" class="form-select" style="flex:1 1 12rem;width:auto" aria-label="Состояние сбора"><option value="">Текущие и сохранённые</option>{% for key,label in states %}<option value="{{ key }}" {% if filters.state == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
<select name="enabled" class="form-select" style="flex:1 1 10rem;width:auto" aria-label="Включено"><option value="">Любое состояние</option><option value="yes" {% if filters.enabled == 'yes' %}selected{% endif %}>Включено</option><option value="no" {% if filters.enabled == 'no' %}selected{% endif %}>Отключено</option></select>
<button class="btn btn-primary">Найти</button></form>
